<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Canvas｜圖表指南</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f6f8fb;--surface:#fff;--fg:#243046;--muted:#748097;--line:#e2e6ee;--accent:#4f5bdd;--page-font:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 var(--page-font)}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.topbar{position:sticky;top:0;z-index:20;min-height:64px;display:flex;align-items:center;gap:14px;padding:0 max(18px,calc((100vw - 1180px)/2));background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{font-weight:800;font-size:19px;text-decoration:none;white-space:nowrap}.brand span{color:var(--accent)}
.nav{display:flex;gap:5px;margin-left:auto}.nav a{padding:8px 10px;border-radius:9px;text-decoration:none;font-size:12px}.nav a:hover{background:#eef1f7}.nav a.active{background:#263c60;color:#fff}
.font-control{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}.font-control select{padding:7px 9px;border:1px solid #d8deea;border-radius:8px;background:#fff;color:var(--fg)}
.page{max-width:1180px;margin:auto;padding:28px 22px 64px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-bottom:18px}.eyebrow{font-size:9px;letter-spacing:.14em;color:#7b8698}.hero h1{font-size:30px;line-height:1.25;margin:7px 0 8px;letter-spacing:-.025em}.hero p{margin:0;color:var(--muted);max-width:850px}
.selector,.results,.reference{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.selector{padding:20px;margin-bottom:18px}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px}.section-head h2{font-size:19px;margin:3px 0}.section-head p{margin:0;color:var(--muted);font-size:12px}
.intent-grid{display:flex;gap:7px;flex-wrap:wrap}.intent{padding:8px 11px;border:1px solid #dbe1ec;border-radius:999px;background:#fff;color:var(--fg);text-align:left}.intent strong{font-size:11px}.intent small{display:none}.intent.active{border-color:#5c65df;background:#eef0ff;color:#3842ad}
.recommendation{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}.recommendation[hidden]{display:none}.recommendation-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.recommendation-title strong{font-size:13px}.recommendation-title span{font-size:10px;color:var(--muted)}
.recommend-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.recommend-card{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fafbfe}.recommend-card strong{display:block;font-size:12px}.recommend-card p{font-size:10px;color:var(--muted);margin:4px 0 9px;min-height:30px}.recommend-card a{display:inline-block;font-size:10px;text-decoration:none;color:#4550c1;font-weight:700}
.results{padding:20px}.filters{display:grid;grid-template-columns:minmax(220px,1fr) 210px auto;gap:9px;align-items:center;position:sticky;top:76px;z-index:10;background:#fffffff3;padding:9px;border:1px solid var(--line);border-radius:13px;margin-bottom:14px;backdrop-filter:blur(12px)}.filters input,.filters select{width:100%;padding:9px 11px;border:1px solid #d8deea;border-radius:9px;background:white;color:var(--fg)}#count{font-size:10px;color:var(--muted);white-space:nowrap}
.chart-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.chart-card{display:flex;flex-direction:column;min-height:175px;padding:14px;border:1px solid var(--line);border-radius:13px;background:white;transition:.15s ease}.chart-card:hover{transform:translateY(-1px);box-shadow:0 8px 22px #263c6010;border-color:#ccd3df}.chart-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.chart-card h3{font-size:15px;margin:3px 0 0}.chart-badge{font-size:9px;color:#667286;background:#f2f4f8;border-radius:999px;padding:3px 6px}.chart-use{font-size:11px;color:var(--muted);margin:10px 0}.chart-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:9px}.chart-actions a,.chart-actions button{border:1px solid #dce2ed;border-radius:8px;background:#fff;padding:6px 8px;font-size:10px;text-decoration:none;color:#33415a}.chart-actions .use{background:#515cdd;color:#fff;border-color:#515cdd}.chart-actions button:hover,.chart-actions a:hover{background:#eef1fb}.chart-actions .use:hover{background:#444ec8}
.chart-card details{margin-top:9px;border-top:1px dashed #e3e7ee;padding-top:7px}.chart-card summary{cursor:pointer;font-size:10px;color:#657287}.more-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.code{width:100%;height:180px;margin-top:8px;padding:9px;border:1px solid #dce2ed;border-radius:8px;background:#f8fafc;font:10px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
#notice{min-height:20px;margin:8px 0 0;color:#4854c7;font-size:10px}
.reference{margin-top:18px;padding:14px 18px}.reference>summary{cursor:pointer;font-weight:700}.book-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-top:12px}.book{padding:10px;border:1px solid var(--line);border-radius:10px}.book strong,.book small{display:block}.book small{color:var(--muted);font-size:10px}.book a{font-size:10px}
.empty{grid-column:1/-1;padding:48px 16px;text-align:center;color:var(--muted)}
@media(max-width:900px){.recommend-grid{grid-template-columns:1fr 1fr}.chart-grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 180px}.filters #count{grid-column:1/-1}.font-control span{display:none}}
@media(max-width:620px){.page{padding:18px 12px 48px}.hero{padding:20px}.hero h1{font-size:25px}.chart-grid,.recommend-grid,.book-list{grid-template-columns:1fr}.filters{position:static;grid-template-columns:1fr}.topbar{padding:8px 12px;flex-wrap:wrap}.nav{order:3;width:100%;margin-left:0}.nav a{flex:1;text-align:center}.font-control{margin-left:auto}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../../index.html"><span>◈</span> Visual Canvas</a>
  <nav class="nav" aria-label="主要介面">
    <a href="../../index.html">工作台</a>
    <a class="active" href="./">圖表指南</a>
    <a href="../../extensions/research-studio/index.html">研究工作室</a>
  </nav>
  <label class="font-control"><span>作品字體</span><select id="guideFont" aria-label="作品字體"></select></label>
</header>

<main class="page">
  <section class="hero">
    <div class="eyebrow">CHART GUIDE / 說明與選圖</div>
    <h1>不知道該用哪張圖時，再來這裡。</h1>
    <p>先看你要回答的問題，再看推薦圖。已經知道要用什麼，就直接搜尋圖名或回工作台，不必經過完整說明流程。</p>
  </section>

  <section class="selector">
    <div class="section-head">
      <div>
        <div class="eyebrow">用途選擇器</div>
        <h2>你想表達什麼？</h2>
        <p>只做選圖判斷；真正填資料、改圖與匯出仍在工作台。</p>
      </div>
    </div>
    <div id="intentGrid" class="intent-grid"></div>
    <div id="recommendation" class="recommendation" hidden>
      <div class="recommendation-title"><strong id="recommendTitle">推薦</strong><span>推薦不是唯一答案，仍要看資料形狀。</span></div>
      <div id="recommendGrid" class="recommend-grid"></div>
    </div>
  </section>

  <section class="results">
    <div class="section-head">
      <div>
        <div class="eyebrow">完整圖庫</div>
        <h2>100 種圖表</h2>
        <p>知道圖名就直接搜尋；每張卡只保留用途與「在工作台使用」。JSON 與 AI 指令收在更多裡。</p>
      </div>
    </div>
    <div class="filters">
      <input id="search" type="search" placeholder="搜尋：折線、比較、SWOT、流程、產能…" aria-label="搜尋圖表">
      <select id="category" aria-label="圖表分類"><option value="">全部分類</option></select>
      <span id="count"></span>
    </div>
    <p id="notice" role="status" aria-live="polite"></p>
    <div id="charts" class="chart-grid"></div>
  </section>

  <details class="reference">
    <summary>延伸閱讀</summary>
    <div id="books" class="book-list"></div>
  </details>
</main>

<script src="data.js"></script>
<script src="../../extensions/appearance.js"></script>
<script>
'use strict';
const data=window.VC_HANDBOOK_DATA;
const $=id=>document.getElementById(id);
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;};

const intentDefs=[
  {id:'all',label:'全部',desc:'直接瀏覽完整圖庫',test:()=>true},
  {id:'compare',label:'比較',desc:'類別、方案、群組差異',test:c=>/(比較|群組|排名|矩陣|雷達|長條|箱形|小提琴|差異)/.test(c.use+c.label)},
  {id:'trend',label:'趨勢',desc:'時間變化與走勢',test:c=>/(趨勢|時間|折線|面積|甘特|時間軸|日曆)/.test(c.use+c.label)},
  {id:'distribution',label:'分布',desc:'離散程度、區間與密度',test:c=>/(分布|直方|箱形|小提琴|密度|熱圖|散佈)/.test(c.use+c.label)},
  {id:'relation',label:'關係',desc:'概念、變量與網路關聯',test:c=>/(關係|關聯|概念|網路|散佈|相關|Venn|集合)/i.test(c.use+c.label+c.id)},
  {id:'flow',label:'流程',desc:'步驟、交接、順序',test:c=>/(流程|步驟|泳道|序列|SIPOC|資料流|循環)/i.test(c.use+c.label+c.id)},
  {id:'cause',label:'因果',desc:'原因、結果、問題拆解',test:c=>/(因果|原因|魚骨|why|cause|影響)/i.test(c.use+c.label+c.id)},
  {id:'decision',label:'決策',desc:'選擇、優先序與策略',test:c=>/(決策|優先|SWOT|TOWS|策略|矩陣|象限|價值)/i.test(c.use+c.label+c.id)},
  {id:'engineering',label:'工業工程',desc:'品質、產能、效率與排程',test:c=>/(工程|產能|OEE|能力|柏拉圖|製程|節拍|排程|效率|工時|Little|SPC)/i.test(c.use+c.label+c.id)},
  {id:'learning',label:'學習整理',desc:'知識結構、複習與筆記',test:c=>/(學習|課程|概念|筆記|複習|考試|公式|知識|Cornell|KWL)/i.test(c.use+c.label+c.id)}
];

let activeIntent='all';

function applyGuideFont(){
  document.documentElement.style.setProperty('--page-font',VCStyle.state().fontFamily);
}
for(const [id,preset] of Object.entries(VCStyle.fontPresets)){
  const o=el('option',preset.name);o.value=id;$('guideFont').append(o);
}
$('guideFont').value=VCStyle.state().font;
$('guideFont').onchange=()=>{VCStyle.set({font:$('guideFont').value});applyGuideFont();};
applyGuideFont();

for(const c of [...new Set(data.charts.map(c=>c.category))]){
  const o=el('option',c);o.value=c;$('category').append(o);
}

function setIntent(id){
  activeIntent=intentDefs.some(x=>x.id===id)?id:'all';
  document.querySelectorAll('.intent').forEach(b=>b.classList.toggle('active',b.dataset.intent===activeIntent));
  renderRecommendations();
  renderCharts();
}
for(const item of intentDefs){
  const b=el('button');b.type='button';b.className='intent';b.dataset.intent=item.id;b.title=item.desc;
  b.append(el('strong',item.label),el('small',item.desc));b.onclick=()=>setIntent(item.id);$('intentGrid').append(b);
}
function matchesIntent(c){return (intentDefs.find(x=>x.id===activeIntent)||intentDefs[0]).test(c);}
function scoreChart(c,intent){
  const boosts={
    compare:['bar','grouped_bar','comparison_matrix','radar','box','violin'],
    trend:['line','area','stacked_area','timeline','gantt'],
    distribution:['histogram','box','violin','scatter','heatmap'],
    relation:['concept_map','scatter','mindmap','network','venn'],
    flow:['process_flow','swimlane','sequence','sipoc','cycle'],
    cause:['fishbone','cause_chain','why','argument_map'],
    decision:['decision_tree','quadrant','swot_analysis','tows_matrix','priority_eisenhower'],
    engineering:['engineering_pareto','oee','process_capability','line_balance','capacity_plan'],
    learning:['mindmap','concept_map','formula_map','exam_overview','cornell_notes']
  };
  const list=boosts[intent]||[];let score=matchesIntent(c)?10:0;const idx=list.indexOf(c.id);if(idx>=0)score+=30-idx;return score;
}
function renderRecommendations(){
  const box=$('recommendation');
  if(activeIntent==='all'){box.hidden=true;return;}
  const def=intentDefs.find(x=>x.id===activeIntent);
  const items=data.charts.filter(c=>def.test(c)).sort((a,b)=>scoreChart(b,activeIntent)-scoreChart(a,activeIntent)).slice(0,4);
  $('recommendTitle').textContent='「'+def.label+'」可以先看';
  $('recommendGrid').replaceChildren();
  for(const c of items){
    const card=el('article');card.className='recommend-card';card.append(el('strong',c.label),el('p',c.use));
    const a=el('a','在工作台使用 →');a.href='../../index.html?template='+encodeURIComponent(c.id);card.append(a);$('recommendGrid').append(card);
  }
  box.hidden=false;
}
async function copy(text,box){
  try{await navigator.clipboard.writeText(text);$('notice').textContent='已複製。';}
  catch{box.hidden=false;box.value=text;box.focus();box.select();$('notice').textContent='請按 Command+C 或 Ctrl+C 複製。';}
}
function renderCharts(){
  const q=$('search').value.trim().toLowerCase(),cat=$('category').value;
  const items=data.charts.filter(c=>(!cat||c.category===cat)&&matchesIntent(c)&&(!q||[c.label,c.id,c.use,c.category].join(' ').toLowerCase().includes(q)));
  $('charts').replaceChildren();$('count').textContent=items.length+' / '+data.charts.length+' 種';
  if(!items.length){const empty=el('div','找不到符合條件的圖表。');empty.className='empty';$('charts').append(empty);return;}
  for(const c of items){
    const card=el('article');card.className='chart-card';
    const top=el('div');top.className='chart-top';
    const titleBox=el('div');const catLabel=el('div',c.category);catLabel.className='eyebrow';titleBox.append(catLabel,el('h3',c.label));
    const badge=el('span',c.id);badge.className='chart-badge';top.append(titleBox,badge);
    const use=el('p',c.use);use.className='chart-use';
    const actions=el('div');actions.className='chart-actions';
    const useLink=el('a','在工作台使用');useLink.className='use';useLink.href='../../index.html?template='+encodeURIComponent(c.id);actions.append(useLink);
    const json=JSON.stringify(c.example,null,2);
    const details=el('details'),summary=el('summary','更多：JSON / AI 指令'),more=el('div');more.className='more-actions';
    const jsonBtn=el('button','複製 JSON'),promptBtn=el('button','複製 AI 指令'),box=el('textarea');box.className='code';box.hidden=true;box.readOnly=true;box.setAttribute('aria-label',c.label+' 可複製內容');
    jsonBtn.type=promptBtn.type='button';jsonBtn.onclick=()=>copy(json,box);promptBtn.onclick=()=>copy(c.prompt,box);more.append(jsonBtn,promptBtn);details.append(summary,more,box);
    card.append(top,use,actions,details);$('charts').append(card);
  }
}
$('search').oninput=renderCharts;$('category').onchange=renderCharts;setIntent('all');

for(const b of data.books){
  const card=el('article');card.className='book';card.append(el('strong',b.title),el('small',b.author),el('small',b.use));
  const a=el('a','查閱來源 →');a.href=b.url;a.target='_blank';a.rel='noopener noreferrer';card.append(a);$('books').append(card);
}
</script>
</body>
</html>
