<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Canvas｜30 種圖形</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#243046;background:#f7f8fc}header{height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid #ddd;background:white}header strong{font-size:22px}button{border:1px solid #dce1ea;background:white;color:#263c60;padding:9px 13px;border-radius:8px;cursor:pointer}button:hover{background:#edf1fb}.primary{background:#515cdd;color:white}main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 64px)}aside{padding:20px;background:white;border-right:1px solid #ddd;overflow:auto}textarea{width:100%;height:48vh;resize:vertical;font:13px/1.6 monospace;padding:12px;border:1px solid #dce1ea;border-radius:8px}h2{font-size:17px}p{font-size:13px;line-height:1.7}#status{color:#9a3348;white-space:pre-wrap}.workspace{position:relative;overflow:hidden}.toolbar{position:absolute;top:16px;left:16px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}#canvas{width:100%;height:100%;touch-action:none;cursor:grab;background:radial-gradient(#dde2ef 1px,transparent 1px);background-size:20px 20px}#canvas:active{cursor:grabbing}#detail{position:absolute;bottom:16px;left:16px;right:16px;background:#ffffffed;border:1px solid #e2e7ef;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:13px;max-height:160px;overflow:auto}svg text{user-select:none}.hint{color:#7b8496}@media(max-width:720px){main{grid-template-columns:1fr;height:auto}textarea{height:180px}.workspace{height:70vh}aside{border-right:0}}</style>
<header><strong>◈ Visual Canvas</strong><span class="hint">貼上指令，直接成圖</span></header>
<main><aside><h2>圖形指令</h2><p>貼入 JSON，按「產生」。不需上傳文件或設定 API。</p><label for="chartType">圖表類型</label><select id="chartType" style="width:100%;padding:10px;margin:8px 0" aria-label="圖表類型"></select><p class="hint">選類型後按「範例」可載入對應指令。更換類型不會自動轉換資料。</p><textarea id="input" aria-label="JSON 指令" spellcheck="false"></textarea><p><button id="generate" class="primary">產生圖形</button> <button id="sample">範例</button></p><p id="status" role="status" aria-live="polite"></p><p class="hint">拖曳空白處移動畫布，滾輪縮放。點節點查看說明；雙擊節點修改文字，點分支旁的 −／+ 收合。</p><button id="json">儲存指令</button> <button id="export">匯出圖片</button></aside><div class="workspace"><div class="toolbar"><button id="fit">適合畫面</button><button id="plus">＋</button><button id="minus">−</button><button id="expand">全部展開</button><button id="collapse">收合分支</button><button id="hide">隱藏輸入區</button></div><svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="互動心智圖"><g id="scene"></g></svg><div id="plot" style="display:none;position:absolute;inset:70px 0 0"></div><div id="detail">貼入指令即可開始。</div></div></main>
<script src="charts.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const sample={type:'mindmap',title:'我的學習系統',branches:[{title:'課前準備',children:[{title:'閱讀講義'},{title:'整理問題'}]},{title:'課堂學習',children:[{title:'補充筆記'},{title:'觀察範例'}]},{title:'課後複習',children:[{title:'解題練習'},{title:'說明概念'}]},{title:'成果檢查',children:[{title:'錯題整理'},{title:'調整計畫'}]}]};
let chartData=null,renderToken=0;let root=null,count=0,zoom=1,tx=0,ty=0,positions=[],bounds=null;
function normalize(data){let total=0;function node(n,depth){if(depth>15||++total>500)throw Error('請限制在 15 層、500 個節點內。');if(!n||typeof n!=='object'||Array.isArray(n))throw Error('節點需為物件。');const title=n.title??n.label;if(typeof title!=='string'||!title.trim()||title.length>200)throw Error('節點標題需為 1–200 字。');if(n.description!==undefined&&typeof n.description!=='string')throw Error('description 必須是文字。');if(n.sources!==undefined&&(!Array.isArray(n.sources)||n.sources.some(s=>!s||typeof s.document!=='string'||typeof s.location!=='string')))throw Error('來源需含 document、location。');const children=n.children??[];if(!Array.isArray(children))throw Error('children 必須是陣列。');return {title,description:n.description||'',sources:n.sources||[],children:children.map(c=>node(c,depth+1)),closed:false};}
if(!data||typeof data.title!=='string'||!data.title.trim())throw Error('缺少 title。');let result;if(data.schema_version==='1.0')result=node(data.root,0);else{if(data.type!=='mindmap')throw Error('type 需為 mindmap。');if(!Array.isArray(data.branches))throw Error('缺少 branches 陣列。');result=node({title:data.title,children:data.branches},0);}count=total;return result;}
function svg(tag,attrs,text){const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs||{}))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e;}
const colors=['#6b65d8','#259b8b','#d99932','#d2688a','#468bc7','#8c9e41'];
function lines(s){const chars=Array.from(s),out=[];while(chars.length)out.push(chars.splice(0,12).join(''));return out;}
function height(n){const own=Math.max(54,lines(n.title).length*22+24);return !n.closed&&n.children.length?Math.max(own,n.children.reduce((s,c)=>s+height(c),0)+18*(n.children.length-1)):own;}
function layout(n,x,y,side,color,parent){const text=lines(n.title),h=Math.max(48,text.length*22+18);const p={n,x,y,h,color,parent};positions.push(p);if(!n.closed&&n.children.length){let cursor=y-height(n)/2;for(const c of n.children){const ch=height(c);layout(c,x+side*230,cursor+ch/2,side,color,p);cursor+=ch+18;}}}
function draw(){if(!root)return;positions=[];const rp={n:root,x:0,y:0,h:Math.max(56,lines(root.title).length*22+20),color:'#424f89',parent:null};positions.push(rp);const right=root.children.filter((_,i)=>i%2===0),left=root.children.filter((_,i)=>i%2===1);for(const [nodes,side]of [[right,1],[left,-1]]){let cursor=-(nodes.reduce((s,c)=>s+height(c),0)+18*Math.max(0,nodes.length-1))/2;for(const n of nodes){const h=height(n);layout(n,side*230,cursor+h/2,side,colors[root.children.indexOf(n)%colors.length],rp);cursor+=h+18;}}
const scene=$('scene');scene.replaceChildren();for(const p of positions){if(!p.parent)continue;const a=p.parent,side=p.x>a.x?1:-1,x1=a.x+side*85,x2=p.x-side*85;scene.append(svg('path',{d:`M ${x1} ${a.y} C ${(x1+x2)/2} ${a.y}, ${(x1+x2)/2} ${p.y}, ${x2} ${p.y}`,fill:'none',stroke:p.color,'stroke-width':3}));}
for(const p of positions){const g=svg('g',{transform:`translate(${p.x},${p.y})`,role:'button',tabindex:0,'aria-label':p.n.title,style:'cursor:pointer'});g.append(svg('rect',{x:-85,y:-p.h/2,width:170,height:p.h,rx:12,fill:p.parent?'#fff':p.color,stroke:p.color,'stroke-width':2}));const ls=lines(p.n.title);ls.forEach((l,i)=>g.append(svg('text',{x:0,y:(i-(ls.length-1)/2)*22+5,'text-anchor':'middle',fill:p.parent?'#27354a':'white','font-size':15,'font-family':'system-ui,sans-serif'},l)));g.onclick=()=>{$('detail').textContent=p.n.title+(p.n.description?'\n'+p.n.description:'')+(p.n.sources.length?'\n來源：'+p.n.sources.map(s=>s.document+' · '+s.location).join('\n'):'');};g.onkeydown=e=>{if(e.key==='Enter')g.onclick();};g.ondblclick=()=>{const t=prompt('修改節點文字',p.n.title);if(t?.trim()&&t.length<=200){p.n.title=t.trim();sync();draw();}};if(p.n.children.length&&p.parent){const c=svg('g',{transform:`translate(${p.x>0?98:-98},0)`});c.append(svg('circle',{r:10,fill:p.color}));c.append(svg('text',{'text-anchor':'middle',y:5,fill:'white','font-size':15},p.n.closed?'+':'−'));c.onclick=e=>{e.stopPropagation();p.n.closed=!p.n.closed;draw();};g.append(c);}scene.append(g);}
bounds={x:Math.min(...positions.map(p=>p.x-110)),y:Math.min(...positions.map(p=>p.y-p.h/2))-20,right:Math.max(...positions.map(p=>p.x+110)),bottom:Math.max(...positions.map(p=>p.y+p.h/2))+20};transform();}
function transform(){$('scene').setAttribute('transform',`translate(${tx},${ty}) scale(${zoom})`);}
function fit(){if(!bounds)return;const r=$('canvas').getBoundingClientRect(),w=bounds.right-bounds.x,h=bounds.bottom-bounds.y;zoom=Math.max(.03,Math.min(1.3,(r.width-60)/w,(r.height-170)/h));tx=r.width/2-(bounds.x+bounds.right)/2*zoom;ty=r.height/2+15-(bounds.y+bounds.bottom)/2*zoom;transform();}
async function generate(){const token=++renderToken;try{if($('input').value.length>2e6)throw Error('指令超過 2 MB。');const d=JSON.parse($('input').value);const type=d.schema_version==='1.0'?'mindmap':d.type;if(type==='mindmap'){const next=normalize(d);root=next;chartData=null;switchView(false);$('chartType').value='mindmap';draw();fit();$('status').textContent=`已產生 ${count} 個節點。`;$('detail').textContent='點選節點查看說明。';}else{const config=chartConfig(d);$('status').textContent='載入圖表引擎…';const P=await loadPlotly();if(token!==renderToken)return;switchView(true);await P.newPlot('plot',config.traces,config.layout,{responsive:true,displaylogo:false,toImageButtonOptions:{format:'png',filename:'chart',scale:2}});if(token!==renderToken)return;chartData=d;$('chartType').value=d.type;$('status').textContent='已產生 '+CHARTS.find(c=>c[0]===d.type)[1]+'。';}}catch(e){if(token===renderToken)$('status').textContent='無法產生：'+e.message;}}
function switchView(chart){$('canvas').style.display=chart?'none':'';$('plot').style.display=chart?'block':'none';$('detail').style.display=chart?'none':'';for(const id of ['fit','plus','minus','expand','collapse'])$(id).style.display=chart?'none':'';}

function output(n){return {title:n.title,...(n.description?{description:n.description}:{}),...(n.sources.length?{sources:n.sources}:{}),children:n.children.map(output)};}
function sync(){$('input').value=JSON.stringify({type:'mindmap',title:root.title,branches:root.children.map(output)},null,2);}
function save(text,type,name){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('generate').onclick=generate;$('sample').onclick=()=>{$('input').value=JSON.stringify(chartExample($('chartType').value),null,2);generate();};$('fit').onclick=fit;$('plus').onclick=()=>{zoom=Math.min(4,zoom*1.2);transform();};$('minus').onclick=()=>{zoom=Math.max(.03,zoom/1.2);transform();};
function closeAll(n,value){n.closed=value;n.children.forEach(c=>closeAll(c,value));}for(const [id,value]of [['expand',false],['collapse',true]])$(id).onclick=()=>{if(root){root.children.forEach(n=>closeAll(n,value));draw();fit();}};
$('json').onclick=()=>{if(chartData){save(JSON.stringify(chartData,null,2),'application/json','chart.json');}else if(root){sync();save($('input').value,'application/json','mindmap.json');}};
$('export').onclick=async()=>{if(chartData){try{await window.Plotly.downloadImage('plot',{format:'png',filename:'chart',scale:2});}catch(e){$('status').textContent='匯出失敗：'+e.message;}return;}if(!bounds)return;const copy=$('canvas').cloneNode(true);copy.removeAttribute('id');copy.setAttribute('viewBox',`${bounds.x-20} ${bounds.y-20} ${bounds.right-bounds.x+40} ${bounds.bottom-bounds.y+40}`);copy.setAttribute('width',bounds.right-bounds.x+40);copy.setAttribute('height',bounds.bottom-bounds.y+40);copy.querySelector('g').removeAttribute('transform');copy.querySelectorAll('[tabindex]').forEach(n=>n.removeAttribute('tabindex'));save(new XMLSerializer().serializeToString(copy),'image/svg+xml','mindmap.svg');};
let drag=null;const canvas=$('canvas');canvas.onpointerdown=e=>{if(e.target.closest('[role="button"]'))return;drag={x:e.clientX,y:e.clientY,tx,ty};canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform();}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,next=Math.max(.03,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));tx=x-(x-tx)*next/zoom;ty=y-(y-ty)*next/zoom;zoom=next;transform();},{passive:false});
$('hide').onclick=()=>{const aside=document.querySelector('aside'),hidden=aside.hidden=!aside.hidden;document.querySelector('main').style.gridTemplateColumns=hidden?'1fr':'';$('hide').textContent=hidden?'顯示輸入區':'隱藏輸入區';if(chartData&&window.Plotly)window.Plotly.Plots.resize('plot');else fit();};window.addEventListener('resize',()=>{if(chartData&&window.Plotly)window.Plotly.Plots.resize('plot');else fit();});for(const [value,label]of CHARTS){const o=document.createElement('option');o.value=value;o.textContent=label;$('chartType').append(o);}$('chartType').onchange=()=>{$('status').textContent='選擇完成；按「範例」載入指令，或自行貼入符合此類型的 JSON。';};$('sample').click();
</script></html>
