<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI 知識視覺化</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17243b;font-family:system-ui,sans-serif}header{padding:24px;background:#17243b;color:white}h1{margin:0;font-size:24px}header p{margin-bottom:0}main{display:grid;grid-template-columns:350px 1fr;gap:20px;padding:20px}section{background:white;border-radius:12px;padding:20px}textarea{width:100%;height:350px;padding:12px;font-family:monospace;border:1px solid #bbc5d4;border-radius:8px}button,.file{display:inline-block;padding:10px;margin:6px 4px 6px 0;border:0;border-radius:6px;background:#245bdb;color:white;cursor:pointer;font:inherit}input{max-width:100%}#status{white-space:pre-wrap;color:#a12626}#map{overflow:auto;min-height:350px}ul{list-style:none;padding-left:28px;border-left:2px solid #d7e2f5}li{margin:12px 0}.node{background:#edf3ff;color:#15376c;text-align:left;max-width:100%;overflow-wrap:anywhere}.detail{padding:10px 14px;max-width:700px;white-space:pre-wrap;color:#48566d}small{color:#607086}@media(max-width:800px){main{grid-template-columns:1fr}textarea{height:240px}}
</style>
<header><h1>AI 知識視覺化 · v0.1</h1><p>文件交給 AI → 貼入知識 JSON → 展開心智圖</p></header>
<main><section><h2>輸入資料</h2><p>貼入 JSON，或選擇本機 .json 檔。</p><textarea id="input" aria-label="知識 JSON" spellcheck="false"></textarea><input id="file" type="file" accept=".json,application/json" aria-label="匯入 JSON"><div><button id="render">產生心智圖</button><button id="example">載入範例</button><button id="download">下載 JSON</button></div><p id="status" role="status" aria-live="polite"></p><small>資料留在此頁記憶體；本頁不呼叫 AI、不上傳檔案。重新整理前請下載保存。</small></section><section><h2 id="title">心智圖</h2><p>點選節點可收合分支；展開後可閱讀說明與來源。</p><button id="expand">全部展開</button><button id="collapse">全部收合</button><div id="map"></div></section></main>
<script>
'use strict';
const sample={schema_version:'1.0',title:'管理學：管理職能',root:{id:'management',label:'管理職能',description:'以規劃、組織、領導與控制協調工作。此資料為示範，並非引用你的講義。',sources:[],children:[{id:'planning',label:'規劃',description:'設定目標與達成目標的方法。',sources:[],children:[{id:'goal',label:'例子：訂定本週讀書目標',description:'列出要完成的章節與練習。',sources:[],children:[]}]},{id:'organizing',label:'組織',description:'分配任務與資源。',sources:[],children:[]},{id:'leading',label:'領導',description:'溝通、激勵並引導成員。',sources:[],children:[]},{id:'controlling',label:'控制',description:'比較成果與目標，採取修正行動。',sources:[],children:[]}]}};
const el=id=>document.getElementById(id);let current=null;
function validate(data){
 if(!data||data.schema_version!=='1.0'||typeof data.title!=='string'||!data.title.trim())throw Error('需要 schema_version: "1.0" 與非空的 title。');
 const ids=new Set();let count=0;
 function walk(n,depth){if(depth>20)throw Error('最多支援 20 層。');if(++count>1000)throw Error('最多支援 1000 個節點，請按章節拆分。');if(!n||typeof n!=='object'||Array.isArray(n))throw Error('節點必須是物件。');if(typeof n.id!=='string'||!n.id.trim()||ids.has(n.id))throw Error('節點 id 必須非空且不能重複。');ids.add(n.id);if(typeof n.label!=='string'||!n.label.trim()||n.label.length>200)throw Error('節點 label 需為 1–200 字。');if(n.description!==undefined&&typeof n.description!=='string')throw Error('description 必須是文字。');if(!Array.isArray(n.children))throw Error(n.id+' 缺少 children 陣列。');if(n.sources!==undefined&&(!Array.isArray(n.sources)||n.sources.some(s=>!s||typeof s.document!=='string'||typeof s.location!=='string')))throw Error('sources 需包含 document 與 location 文字。');n.children.forEach(x=>walk(x,depth+1));}walk(data.root,1);return count;
}
function drawNode(n){const li=document.createElement('li'),button=document.createElement('button'),body=document.createElement('div');button.className='node';button.textContent=n.label;button.setAttribute('aria-expanded','true');body.className='branch';if(n.description){const p=document.createElement('div');p.className='detail';p.textContent=n.description;body.append(p);}if(n.sources?.length){const p=document.createElement('div');p.className='detail';p.textContent='來源：'+n.sources.map(s=>s.document+' · '+s.location).join('\n');body.append(p);}if(n.children.length){const ul=document.createElement('ul');n.children.forEach(c=>ul.append(drawNode(c)));body.append(ul);}button.onclick=()=>{body.hidden=!body.hidden;button.setAttribute('aria-expanded',String(!body.hidden));};li.append(button,body);return li;}
function render(){try{const raw=el('input').value;if(raw.length>2e6)throw Error('檔案超過 2 MB，請拆分。');const data=JSON.parse(raw),count=validate(data);const ul=document.createElement('ul');ul.append(drawNode(data.root));el('map').replaceChildren(ul);el('title').textContent=data.title;current=data;el('status').textContent='已載入 '+count+' 個節點。';}catch(e){current=null;el('map').replaceChildren();el('title').textContent='心智圖';el('status').textContent='無法產生：'+e.message;}}
el('render').onclick=render;el('example').onclick=()=>{el('input').value=JSON.stringify(sample,null,2);render();};el('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>2e6){el('status').textContent='檔案超過 2 MB，請拆分。';return;}try{el('input').value=await f.text();render();}catch(e){el('status').textContent='讀取失敗：'+e.message;}};
function toggleAll(hidden){document.querySelectorAll('.branch').forEach(b=>b.hidden=hidden);document.querySelectorAll('.node').forEach(b=>b.setAttribute('aria-expanded',String(!hidden)));}el('expand').onclick=()=>toggleAll(false);el('collapse').onclick=()=>toggleAll(true);
el('download').onclick=()=>{render();if(!current)return;const url=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='knowledge.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};el('example').click();
</script></html>
