name: Verify Visual Canvas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Syntax check core and extensions
        shell: bash
        run: |
          set -euo pipefail
          files=(
            builder.js
            charts.js
            gate.js
            gate-config.js
            extensions/editor-state.js
            extensions/diagram-engine.js
            extensions/diagram-network-p1.js
            extensions/diagram-tree-p1.js
            extensions/template-library.js
            extensions/sidebar-workflow.js
            extensions/work-mode.js
            extensions/output-format.js
            extensions/chart-advisor.js
            extensions/presentation-story.js
            extensions/research-workspace.js
            extensions/project-manager.js
            extensions/pdf-export.js
            extensions/appearance.js
            extensions/professional.js
            extensions/chart-guardrails.js
            extensions/smart-layout.js
            extensions/auto-insight.js
            extensions/annotation-layout.js
            extensions/accessibility.js
            extensions/emphasis.js
            extensions/legend-intelligence.js
            extensions/executive-summary-v2.js
            extensions/executive-quality-v3.js
            extensions/executive-quality-panel.js
            extensions/typography/report.js
            extensions/typography/scaling.js
            extensions/learning-charts/catalog.js
            extensions/learning-charts/adapters.js
            extensions/flow-time/catalog.js
            extensions/flow-time/adapters.js
            extensions/strategy/charts.js
            extensions/strategy/business.js
            extensions/engineering/charts.js
            extensions/engineering/calculators.js
            extensions/business-time/charts.js
            extensions/research-studio/catalog.js
            extensions/research-studio/adapters.js
            extensions/research-studio/thinking.js
            extensions/research-studio/layout.js
            extensions/research-studio/studio.js
          )
          for f in "${files[@]}"; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Check local-first Python launchers
        run: python3 -m py_compile tools/offline_setup.py tools/local_server.py tools/check_local_runtime.py

      - name: Check learning charts
        run: node tools/check-learning.cjs
      - name: Check industrial engineering
        run: node tools/check-ie.cjs
      - name: Check business time
        run: node tools/check-business-time.cjs
      - name: Check PDF
        run: node tools/check-pdf.cjs
      - name: Check typography
        run: node tools/check-typography.cjs
      - name: Check presentation design system
        run: node tools/check-design-system.cjs
      - name: Check chart guardrails
        run: node tools/check-guardrails.cjs
      - name: Check Smart Layout
        run: node tools/check-smart-layout.cjs
      - name: Check Auto Insight
        run: node tools/check-auto-insight.cjs
      - name: Check annotation placement
        run: node tools/check-annotation-layout.cjs
      - name: Check accessibility
        run: node tools/check-accessibility.cjs
      - name: Check presentation emphasis
        run: node tools/check-emphasis.cjs
      - name: Check legend intelligence
        run: node tools/check-legend-intelligence.cjs
      - name: Check Executive Summary
        run: node tools/check-executive-summary.cjs
      - name: Check Executive Layout Quality
        run: node tools/check-executive-quality.cjs
      - name: Check secondary interfaces
        run: node tools/check-secondary-interfaces.cjs
      - name: Check local security invariants
        run: node tools/check-security.cjs
      - name: Check architecture boundaries
        run: node tools/check-architecture.cjs
      - name: Check Diagram Engine v1
        run: node tools/check-diagram-engine.cjs
      - name: Check Research Figure Layout
        run: node tools/check-research-layout.cjs
      - name: Check Research Relations P1
        run: node tools/check-research-relations-p1.cjs

      - name: Verify referenced local assets
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const refs=[...html.matchAll(/(?:src|href)="([^"]+)"/g)]
            .map(m=>m[1])
            .filter(x=>!x.startsWith('http')&&!x.startsWith('#')&&!x.startsWith('data:'));
          const missing=refs.filter(x=>!fs.existsSync(x.split('?')[0]));
          if(missing.length){
            console.error('Missing local assets:',missing);
            process.exit(1);
          }
          console.log('Local asset references OK:',refs.length);
          NODE

  local-cross-platform:
    name: Local runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: macOS launcher setup
        if: runner.os == 'macOS'
        shell: bash
        env:
          CI: '1'
        run: |
          ./setup-offline.command
          ./start-local.command --check
          python3 tools/check_local_runtime.py

      - name: Windows launcher setup
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CI: '1'
        run: |
          call setup-offline.bat
          if errorlevel 1 exit /b %errorlevel%
          call start-local.bat --check
          if errorlevel 1 exit /b %errorlevel%
          python tools\check_local_runtime.py

  visual:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install visual-test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare offline runtime assets
        run: python3 tools/offline_setup.py

      - name: Start static server
        run: |
          python3 tools/local_server.py --no-browser --port 4173 > /tmp/visual-canvas-server.log 2>&1 &
          echo $! > /tmp/visual-canvas-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/visual-canvas-server.log
          exit 1

      - name: Browser visual smoke
        env:
          VC_BASE_URL: http://127.0.0.1:4173
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" npm run test:visual

      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-smoke-screenshots
          path: artifacts/visual
          if-no-files-found: warn
          retention-days: 7
